name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - master
      - develop

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: '26.x'
    - name: Install packages with cache
      uses: iCHEF/npm-install-with-cache-action@v4
      with:
        engine: yarn
        args: --frozen-lockfile
    - name: Build packages
      run: yarn prepublish
    - name: Run linter
      run: yarn lint
    - name: Run tests
      run: yarn test
    - name: Codecov
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: "./coverage/coverage-final.json"
